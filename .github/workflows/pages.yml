# Предпросмотр сайта на GitHub Pages.
# Боевой сайт живёт на terranov.ru в корне, а на Pages — в подпапке /terranova/,
# поэтому здесь корневые ссылки получают префикс. Исходники при этом не меняются.
name: Предпросмотр на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Включает Pages в настройках репозитория, если он ещё не включён
      - name: Включить Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Собрать копию с префиксом подпапки
        run: |
          set -e
          mkdir -p _site
          cp -r public/. _site/
          # Ссылки вида href="/..." превращаем в href="/terranova/..."
          find _site -name '*.html' -exec sed -i -E 's#(href|src|srcset|action)="/([^/])#\1="/terranova/\2#g' {} +
          # Отдельно — ссылки ровно на корень
          find _site -name '*.html' -exec sed -i -E 's#href="/"#href="/terranova/"#g' {} +
          # Пометка, что это предпросмотр
          find _site -name '*.html' -exec sed -i 's#</title>#  · предпросмотр</title>#' {} +
          echo "Собрано файлов:"; find _site -type f | wc -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Публикация сайта на GitHub Pages с собственным доменом terranov.ru.
# Домен привязывается файлом CNAME, сайт отдаётся из корня — пути в public/
# уже корневые, переписывать ничего не нужно.
name: Публикация terranov.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Включить Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Собрать сайт
        run: |
          set -e
          mkdir -p _site
          cp -r public/. _site/
          # Привязка собственного домена
          echo "terranov.ru" > _site/CNAME
          echo "Собрано файлов:"; find _site -type f | wc -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
